[package]
name = "petos"
version = "0.2.0"
description = "A living-creature desktop simulation"
authors = ["PetOS contributors"]
edition = "2021"

[lib]
name = "petos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
